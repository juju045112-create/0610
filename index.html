<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>希臘國旗 AR 3D互動導覽</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        /* 確保 A-Frame 場景正確疊加在手機相機畫面上 */
        a-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>

<body>
    
    <a-scene 
        mindar-image="imageTargetSrc: greece.mind; autoStart: true; uiLoading: true; uiError: true; uiScanning: true;"
        color-space="sRGB" 
        renderer="colorManagement: true; physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-assets>
            <a-asset-item id="parthenonModel" src="parthenon.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" intensity="2.5"></a-light>
        <a-light type="directional" position="1 2 1" intensity="1.2"></a-light>

        <a-camera position="0 0 0" look-controls="enabled: false" mindar-image-camera></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            
            <a-entity touch-transform>
                
                <a-gltf-model
                    src="#parthenonModel"
                    position="0 0.2 0"
                    rotation="0 0 0"
                    scale="0.01 0.01 0.01"
                ></a-gltf-model>

                <a-plane
                    position="0 -0.6 0"
                    width="1.5"
                    height="0.6"
                    color="black"
                    opacity="0.85"
                ></a-plane>

                <a-text
                    value="希臘 Greece\n首都：雅典\n著名建築：帕德嫩神廟\n藍白相間9條橫紋，象徵愛琴海浪花"
                    font="https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/notosanstc/NotoSansTC-Regular.json"
                    shader="msdf"
                    negate="false"
                    position="0 -0.6 0.01"
                    align="center"
                    width="1.3"
                    color="white"
                ></a-text>

            </a-entity>

        </a-entity>
    </a-scene>

    <script>
        AFRAME.registerComponent('touch-transform', {
            init: function () {
                const el = this.el;
                this.defaultScale = el.object3D.scale.x;
                this.currentScale = this.defaultScale;
                this.prevDistance = null;
                this.prevAngle = null;
                this.lastTap = 0;

                // 雙擊重設大小與旋轉
                el.addEventListener('click', () => {
                    const now = Date.now();
                    if (now - this.lastTap < 300) {
                        el.object3D.scale.set(this.defaultScale, this.defaultScale, this.defaultScale);
                        el.object3D.rotation.set(0, 0, 0);
                        this.currentScale = this.defaultScale;
                    }
                    this.lastTap = now;
                });

                const canvas = el.sceneEl.canvas;
                
                // 偵測兩指觸控開始
                canvas.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        this.prevDistance = Math.hypot(dx, dy);
                        this.prevAngle = Math.atan2(dy, dx);
                    }
                });

                // 兩指移動時執行縮放與旋轉
                canvas.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && this.prevDistance !== null) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const dist = Math.hypot(dx, dy);
                        const angle = Math.atan2(dy, dx);

                        // 縮放：限制在 0.5～3 倍之間
                        const scaleFactor = dist / this.prevDistance;
                        this.currentScale *= scaleFactor;
                        this.currentScale = Math.min(Math.max(this.currentScale, 0.5), 3);
                        el.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);

                        // 旋轉
                        const deltaAngle = angle - this.prevAngle;
                        const rot = el.object3D.rotation;
                        el.object3D.rotation.set(rot.x, rot.y, rot.z + deltaAngle);

                        this.prevDistance = dist;
                        this.prevAngle = angle;
                        e.preventDefault(); 
                    }
                });

                // 觸控結束後重置參考值
                canvas.addEventListener('touchend', () => {
                    if (el.sceneEl.canvas.touches && el.sceneEl.canvas.touches.length < 2) {
                        this.prevDistance = null;
                        this.prevAngle = null;
                    }
                });
            }
        });
    </script>
</body>

</html>
